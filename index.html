<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetAI - Smart Meeting App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 11px 18px;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */
    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }
